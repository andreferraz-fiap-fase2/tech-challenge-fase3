[project]
name = "tech-challenge-fase3"
version = "0.1.0"
description = "Classificação da alfabetização com contexto territorial — FIAP Fase 3"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.3.3",
  "pandas==2.3.2",
  "pyarrow==21.0.0",
  "scikit-learn==1.7.2",
  "matplotlib==3.10.6",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
