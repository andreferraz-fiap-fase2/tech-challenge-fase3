  <g id="text_30">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #435368" x="496.8" y="58.032" transform="rotate(-0 496.8 58.032)">IBGE: 4.871 municípios · Inep: 5.871 / 5.872 / 5.871 pares completos, na ordem apresentada</text>
  </g>
  <g id="text_31">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #435368" transform="translate(247.629375 405.291938)">Os dois painéis usam alfabetização como alvo; os sinais do IBGE foram invertidos em relação ao risco original.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #435368" transform="translate(254.474297 415.801969)">Métodos e unidades de observação diferem. Associação não é impacto causal nem importância do modelo.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #435368" transform="translate(268.877813 426.312)">Redundância entre atributos municipais: Spearman(PIB per capita, serviços públicos / VAB) = -0,935.</text>
  </g>
